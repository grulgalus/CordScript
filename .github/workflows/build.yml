name: Build Shared Java Core Apps

on:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Windows Java Executable
        shell: bash
        run: |
          mkdir bin
          mkdir input_jar
          
          # 1. Zkompilování s UTF-8
          javac -encoding UTF-8 -cp core -d bin windows/WindowsApp.java core/com/cordbot/core/CordCore.java
          
          # 2. JAR soubor se vytvoří v izolované čisté složce
          jar cfe input_jar/CordBot.jar WindowsApp -C bin .
          
          # 3. Jpackage bere JEN složku input_jar, takže je to hotové za pár vteřin!
          jpackage --type app-image --name CordBotNode --input input_jar --main-jar CordBot.jar --main-class WindowsApp --dest dist --verbose
      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: CordBot-Windows-JavaNode
          path: dist/CordBotNode

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Inject Core to Android
        run: |
          cp -r core/com android/app/src/main/java/
      - name: Build Android APK
        working-directory: ./android
        run: gradle assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CordBot-Android-Java
          path: android/app/build/outputs/apk/debug/*.apk
