name: Build Android and Windows App

on:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install kivy discord.py pyinstaller
      - name: Build Windows EXE
        run: pyinstaller --onefile --windowed main.py
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: CordBot-Windows-EXE
          path: dist/*.exe

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install System Dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev openjdk-17-jdk
          
      - name: Install Buildozer
        run: pip install --upgrade buildozer cython virtualenv
        
      - name: Build Android APK
        run: yes | buildozer android debug
        
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CordBot-Android-APK
          path: bin/*.apk
