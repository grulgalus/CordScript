name: Build Native Android & Windows

on:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PyInstaller and Discord
        run: pip install pyinstaller discord.py
      - name: Build Windows EXE
        run: pyinstaller --onefile --windowed windows/main.py
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: CordBot-Windows-EXE
          path: dist/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
        
      - name: Build Android APK (Native Kotlin)
        working-directory: ./android
        run: gradle assembleDebug
        
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CordBot-Android-Native-APK
          path: android/app/build/outputs/apk/debug/*.apk
